services:
  db:
    build: ./init-db
    image: drivers-db
    container_name: PostgreSQL_DB
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER_SECRET}
      POSTGRES_PASSWORD: ${DB_PASSWORD_SECRET}
      POSTGRES_DB: ${DB_NAME_SECRET}
    volumes:
      - ./stage4/backup4:/backup/backup4:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 90s
    networks:
      - app_network

  api:
    build:
      context: ./stage5
      dockerfile: Dockerfile.api
    container_name: drivers_api
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER_SECRET: ${DB_USER_SECRET}
      DB_PASSWORD_SECRET: ${DB_PASSWORD_SECRET}
      DB_NAME_SECRET: ${DB_NAME_SECRET}
      API_PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  web:
    build:
      context: ./stage5
      dockerfile: Dockerfile.web
    container_name: drivers_web
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api:3001
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - app_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadminApp
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  app_network:
